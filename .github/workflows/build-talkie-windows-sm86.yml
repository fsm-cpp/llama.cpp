name: Build Talkie Windows CUDA sm86

on:
  workflow_dispatch:

jobs:
  build-windows-cuda-sm86:
    runs-on: windows-2022

    steps:
      - name: Checkout talkie branch
        uses: actions/checkout@v4
        with:
          repository: thomasgauthier/llama.cpp
          ref: talkie-1930
          submodules: recursive

      - name: Setup CUDA 12.4
        uses: Jimver/cuda-toolkit@v0.2.24
        with:
          cuda: '12.4.1'
          method: 'network'
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        shell: pwsh
        run: |
          choco install ninja -y

      - name: Verify tools
        shell: pwsh
        run: |
          cmake --version
          ninja --version
          nvcc --version
          where.exe cl
          where.exe nvcc
          where.exe ninja
          echo "CUDA_PATH=$env:CUDA_PATH"

      - name: Configure CMake
        shell: pwsh
        env:
          CC: cl
          CXX: cl
        run: |
          cmake -S . -B build `
            -G "Ninja" `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_CUDA_COMPILER="$env:CUDA_PATH\bin\nvcc.exe" `
            -DGGML_CUDA=ON `
            -DCMAKE_CUDA_ARCHITECTURES=86 `
            -DGGML_NATIVE=OFF `
            -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_CURL=OFF `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build llama-server
        shell: pwsh
        run: |
          cmake --build build --config Release --target llama-server -j 4

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null

          $server = Get-ChildItem -Path build -Recurse -Filter "llama-server.exe" | Select-Object -First 1
          if (-not $server) {
            Write-Error "llama-server.exe not found"
            exit 1
          }

          Copy-Item $server.FullName artifact\llama-server.exe -Force

          Get-ChildItem -Path build -Recurse -Filter "*.dll" | ForEach-Object {
            Copy-Item $_.FullName artifact\ -Force
          }

          if ($env:CUDA_PATH) {
            Copy-Item "$env:CUDA_PATH\bin\cudart64_12.dll" artifact\ -ErrorAction SilentlyContinue
            Copy-Item "$env:CUDA_PATH\bin\cublas64_12.dll" artifact\ -ErrorAction SilentlyContinue
            Copy-Item "$env:CUDA_PATH\bin\cublasLt64_12.dll" artifact\ -ErrorAction SilentlyContinue
            Copy-Item "$env:CUDA_PATH\bin\nvrtc64_120_0.dll" artifact\ -ErrorAction SilentlyContinue
            Copy-Item "$env:CUDA_PATH\bin\nvrtc-builtins64_120.dll" artifact\ -ErrorAction SilentlyContinue
            Copy-Item "$env:CUDA_PATH\bin\nvJitLink_120_0.dll" artifact\ -ErrorAction SilentlyContinue
          }

          Copy-Item LICENSE artifact\LICENSE.txt -ErrorAction SilentlyContinue

          Get-ChildItem artifact

      - name: Zip artifact
        shell: pwsh
        run: |
          Compress-Archive -Path artifact\* -DestinationPath talkie-llama-server-win-cuda-sm86.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: talkie-llama-server-win-cuda-sm86
          path: talkie-llama-server-win-cuda-sm86.zip
